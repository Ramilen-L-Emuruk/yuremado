name: アプリと旧 URL の橋渡しを公開する

# main への push で本番ビルドを作り、アプリを Cloudflare Pages（yuremado.com）へ、
# 旧 URL（github.io の /yuremado/・/yuremado/dmdss/）の橋渡しのページを GitHub Pages へ出す
# （docs/relay-server-design.md §0 の 2026-10-30「まとめたアプリは Cloudflare Pages から配る」）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみを残す（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取り出す
        uses: actions/checkout@v7

      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # ビルドより先に走らせる。失敗するとこのジョブが止まり、どちらの公開にも到達しない。
      # `npm run build` に含まれる型チェック・グリフ検証では挙動の回帰は捕まらない。
      - name: テストを走らせる
        run: npm test

      - name: ビルドする
        run: npm run build

      # 配置用の API トークンは Cloudflare Pages の編集だけに権限を絞ったものを置く。
      # プロジェクト名 yuremado と yuremado.com の割り当ては Cloudflare 側で先に作っておく
      - name: Cloudflare Pages へ公開する
        uses: cloudflare/wrangler-action@v3
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=yuremado --branch=main

  # 橋渡しはアプリが公開されてから出す。先に出すと、渡した先にまだ新しいアプリが無い
  bridge:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取り出す
        uses: actions/checkout@v7

      # 旧アプリの 2 つの置き場所の両方に、同じページと Service Worker を外すための sw.js を置く。
      # 存在しないパスで開かれたときも同じページを出す（404.html）。本体は /yuremado/handoff.js の 1 本
      - name: 橋渡しのページを組む
        run: |
          mkdir -p bridge-dist/dmdss
          cp bridge/index.html bridge/handoff.js bridge/sw.js bridge-dist/
          cp bridge/index.html bridge/sw.js bridge-dist/dmdss/
          cp bridge/index.html bridge-dist/404.html

      - name: GitHub Pages を用意する
        uses: actions/configure-pages@v6

      - name: 成果物を上げる
        uses: actions/upload-pages-artifact@v5
        with:
          path: bridge-dist

  deploy-bridge:
    needs: bridge
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へ公開する
        id: deployment
        uses: actions/deploy-pages@v5
