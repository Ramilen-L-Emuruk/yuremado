<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      SEC-2 注記: クリックジャッキング対策として frame-ancestors CSP を検討したが、
      CSP 仕様上 `<meta>` 経由での frame-ancestors・report-uri・sandbox は
      **ブラウザで無視される**ため、meta タグでは実装不能。GitHub Pages は静的ホスティングで
      レスポンスヘッダーの設定手段を提供していないため、現状ヘッダー配信も不可。
      将来ヘッダー配信可能なホスティングへ移行するか、Service Worker の fetch ハンドラで
      レスポンスヘッダーを付与する対応が必要（現状は未実装・既知の未対策項目）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12151a" />
    <meta name="description" content="気象庁の地震情報・緊急地震速報・津波情報をリアルタイムに表示します。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      ステータスバーは black（不透明）にする。black-translucent にしてはならない。
      iOS のホーム画面から起動した PWA で black-translucent を使うと、レイアウトの基準となる
      ビューポートの高さだけが上端セーフエリア分だけ縮むのに、原点は画面最上端のまま置かれる。
      結果、画面下端にページからは描画できない帯が残り、body の背景色だけが露出する。
      実測値・影響範囲・判定手順は docs/spec/architecture-spec.md の
      「画面いっぱいへの広がりとセーフエリア」規則 4 に集約している。
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="揺れ窓" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <!--
      iOS のホーム画面は apple-touch-icon に PNG を前提とする（SVG が使われる保証は無い）。
      icon.svg から scripts/build-app-icons.mjs で焼いた 180×180 を渡す。角は iOS が丸めるので、
      背景を全面に塗った版にしてある（透明の角を残すと黒く埋まる）。
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <title>揺れ窓</title>
    <!--
      起動の途中で自分のファイルが読めなかったら 1 回だけ読み直す。アプリ本体より先に読むこと
      （本体の読み込みの失敗を拾うため）。仕組みは public/boot-recovery.js の冒頭。
    -->
    <script src="./boot-recovery.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 読み直しても読めなかったときに #root へ出す（boot-recovery.js）。CSS が読めていない前提で直に書く -->
    <template id="boot-failed">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #12151a; color: #e5e7eb; font-family: system-ui, sans-serif;">
        <p style="margin: 0; font-size: 16px;">画面を読み込めませんでした</p>
        <button type="button" style="padding: 8px 20px; font-size: 15px; border-radius: 6px; border: 1px solid #4b5563; background: #1f2937; color: #e5e7eb; cursor: pointer;">再読み込み</button>
      </div>
    </template>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
